_target_: src.models.cifar10_gan_model.CIFAR10GANModel

# LS, abLoss
objective_type : "abLoss"
lr: 0.0002
b1: 0.5
b2: 0.999
n_classes: 10
latent_dim: 100
channels: 3
img_size: 32

